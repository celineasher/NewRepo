name: Verity macOS build check

on:
  push:
    branches: [master]
    paths:
      - 'verity-mac/**'
      - '.github/workflows/verity-macos-check.yml'
  workflow_dispatch:

jobs:
  verify-macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |
          bash -n verity-mac/install.sh
          bash -n verity-mac/install-verity.sh
      - name: Build newest GitHub Verity without launching
        env:
          CI: "1"
        run: bash verity-mac/install.sh --no-launch
      - name: Verify v1.2.8 app bundle
        run: |
          set -euo pipefail
          APP="$HOME/Applications/Verity.app"
          test -x "$APP/Contents/MacOS/Verity"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          test "$VERSION" = '1.2.8'
          grep -Fq 'private var monitorSection: some View' "$HOME/Library/Application Support/Verity/Source/Sources/Verity/Views.swift"
          grep -Fq 'let onDone: () -> Void' "$HOME/Library/Application Support/Verity/Source/Sources/Verity/Views.swift"
          grep -Fq 'private func performOutputTest' "$HOME/Library/Application Support/Verity/Source/Sources/Verity/LiveMicMonitor.swift"
          grep -Fq 'final class LiveMicMonitor' "$HOME/Library/Application Support/Verity/Source/Sources/Verity/LiveMicMonitor.swift"
          grep -Fq 'let monitor = micMonitor' "$HOME/Library/Application Support/Verity/Source/Sources/Verity/VoiceController.swift"
          grep -Fq 'Mic channel (SSL / multi-input)' "$HOME/Library/Application Support/Verity/Source/Sources/Verity/Views.swift"
          grep -Fq 'func testMonitorOutput()' "$HOME/Library/Application Support/Verity/Source/Sources/Verity/VoiceController.swift"
          file "$APP/Contents/MacOS/Verity"
