name: Verity macOS build check

on:
  push:
    paths:
      - 'verity-mac/**'
      - '.github/workflows/verity-macos-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and compile the current Verity installer
        shell: bash
        run: |
          set -euo pipefail
          bash verity-mac/install.sh --no-launch
          test -x "$HOME/Applications/Verity.app/Contents/MacOS/Verity"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$HOME/Applications/Verity.app/Contents/Info.plist")" = '1.2.7'
