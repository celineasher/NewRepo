name: Verity Pixel Motion v1.4 macOS build

on:
  push:
    branches: [master]
    paths:
      - 'verity-mac/mascot-v1.4/**'
      - '.github/workflows/verity-mascot-pixel-motion.yml'
  workflow_dispatch:

jobs:
  verify-mascot:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate source scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n verity-mac/mascot-v1.4/install.sh
          python3 -m py_compile verity-mac/mascot-v1.4/generate-sprites.py
          python3 -m py_compile verity-mac/mascot-v1.4/patch-mascot.py
      - name: Install a clean copy of Verity
        env:
          CI: "1"
        run: bash verity-mac/install.sh --no-launch
      - name: Upgrade only the mascot art and animations
        env:
          CI: "1"
        run: bash verity-mac/mascot-v1.4/install.sh --no-launch
      - name: Verify installed macOS app and all mascot frames
        shell: bash
        run: |
          set -euo pipefail
          app="$HOME/Applications/Verity.app"
          src="$HOME/Library/Application Support/Verity/Source"
          test -x "$app/Contents/MacOS/Verity"
          test -f "$app/Contents/Resources/Sprites/grin.png"
          test -f "$app/Contents/Resources/Sprites/grin_eyes.png"
          test -f "$app/Contents/Resources/Sprites/talk5.png"
          test -f "$app/Contents/Resources/Sprites/blink_half.png"
          test -f "$app/Contents/Resources/AppIcon.icns"
          test -f "$src/Sources/Verity/VerityMascotStage.swift"
          grep -Fq 'VerityMascotStage(store: store, time: time)' "$src/Sources/Verity/Views.swift"
          grep -Fq 'store.toggleVoice()' "$src/Sources/Verity/Views.swift"
          grep -Fq 'PushToTalkControl(store: store' "$src/Sources/Verity/Views.swift"
          python3 verity-mac/mascot-v1.4/patch-mascot.py "$src"
          file "$app/Contents/MacOS/Verity"
          echo 'Verity Pixel Motion v1.4 macOS build and control preservation PASSED'
