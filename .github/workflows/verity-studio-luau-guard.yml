name: Verify Verity Studio Luau property guard

on:
  push:
    branches: [master]
    paths:
      - 'verity-mac/verity-studio-luau-guard-v132.py'
      - 'verity-mac/repair-luau-property.sh'
      - '.github/workflows/verity-studio-luau-guard.yml'
  workflow_dispatch:

jobs:
  bridge-luau-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate repair scripts
        run: |
          bash -n verity-mac/repair-luau-property.sh
          python3 -m py_compile verity-mac/verity-studio-luau-guard-v132.py
      - name: Apply patches to the actual Studio bridge bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/studio-source
          line="$(awk '/^__VERITY_STUDIO_PAYLOAD__$/ { print NR+1; exit }' verity-mac/install-studio-mode.sh)"
          test -n "$line"
          tail -n "+$line" verity-mac/install-studio-mode.sh | base64 -d > /tmp/studio.tgz
          tar -xzf /tmp/studio.tgz -C /tmp/studio-source
          python3 verity-mac/fix-studio-bridge-1.3.1.py /tmp/studio-source/studio_agent.py
          python3 verity-mac/verity-studio-luau-guard-v132.py /tmp/studio-source/studio_agent.py
          python3 -m py_compile /tmp/studio-source/studio_agent.py
          # Reapplying the fix must be safe.
          python3 verity-mac/verity-studio-luau-guard-v132.py /tmp/studio-source/studio_agent.py
      - name: Test Luau validation against invalid properties
        run: |
          python3 - <<'PY'
          import ast
          import re
          from pathlib import Path
          source = Path('/tmp/studio-source/studio_agent.py').read_text()
          ast_tree = ast.parse(source)
          func = next(x for x in ast_tree.body if isinstance(x, ast.FunctionDef) and x.name=='validate_generated_luau')
          class MCPError(RuntimeError):
              pass
          ns={'re':re,'MCPError':MCPError}
          exec(compile(ast.Module(body=[func],type_ignores=[]),'<test>','exec'),ns)
          validate = ns['validate_generated_luau']
          bad = [
              'local deathScript = Instance.new("Script")\ndeathScript.Author = "Verity"',
              'local ds = Instance.new("LocalScript")\nds.Author="Verity"',
              'workspace.DeathPart.DeathScript.Author',
          ]
          good = [
              'deathScript:SetAttribute("Author", "Verity")',
              'local meta = {}\nmeta.Author = "Verity"',
          ]
          for code in bad:
              try:
                  validate(code)
              except MCPError:
                  continue
              raise AssertionError('Invalid .Author was not rejected: '+code)
          for code in good:
              validate(code)
          print('Property guard tests passed')
          PY
